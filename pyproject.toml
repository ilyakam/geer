[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geer"
version = "0.0.0"
description = "Free, private, and open source coding agent that challenges the frontier"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Ilya Kaminsky" },
]
dependencies = [
  "hf-xet==1.5.2",
  "huggingface-hub==1.24.0",
  "semble[mcp]==0.5.2",
]

[project.scripts]
geer = "geer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
]
